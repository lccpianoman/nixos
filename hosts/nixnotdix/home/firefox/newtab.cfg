// Appended to the wrapper's mozilla.cfg and run with chrome privileges at
// startup. Firefox blanks the URL bar for any URL equal to
// AboutNewTab.newTabURL (isInitialPage, browser.js), and only privileged JS
// can set that — so take the target from a pref home-manager writes.
(function () {
  try {
    var url = Services.prefs.getStringPref("nixos.newtab.url", "");
    if (url) {
      ChromeUtils.importESModule(
        "resource:///modules/AboutNewTab.sys.mjs"
      ).AboutNewTab.newTabURL = url;
    }
  } catch (e) {
    Services.console.logStringMessage("newtab.cfg: " + e);
  }
})();
